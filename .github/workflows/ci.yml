name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runs typecheck, unit tests, build, bot playthrough and screenshots for lib + every game.
      - run: npm run gates
        env:
          # No GPU on hosted runners: fps is reported, not gated, in CI. The 50 fps gate runs locally on GPU (studio D-003).
          QW_MIN_FPS: '0'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: qa-evidence
          path: |
            games/*/qa/
            games/*/playwright-report/
          if-no-files-found: ignore
